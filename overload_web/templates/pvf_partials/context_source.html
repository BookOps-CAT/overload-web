{% import "components/macros.html" as macro %}
<div id="context-block"
     hx-get="/update-context?workflow=pvf"
     hx-trigger="change delay:200ms, load"
     hx-include="this"
     hx-swap="none"
     class="grid-container">
  <div id="library-select" class="grid-item">{{ macro.context_select("library", context_fields["library"], "pvf-form") }}</div>
  <div id="collection-select" class="grid-item">{{ macro.context_select("collection", context_fields["collection"], "pvf-form") }}</div>
  <div id="record-type-select" class="grid-item">{{ macro.context_select("record_type", context_fields["record_type"], "pvf-form") }}</div>
</div>
