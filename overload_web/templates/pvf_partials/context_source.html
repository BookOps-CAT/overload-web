{% import "macros/pvf.html" as macro %}
<div class="card context-card">
  <div class="card-body d-flex align-items-center">
    <div class="row g-3 w-100"
         hx-get="/forms/update-context"
         hx-trigger="change from:.context-card select, load"
         hx-include="closest .context-card"
         hx-swap="none">
      <div class="col align-self-center" id="library_wrapper">
        {{ macro.context_select("library", context_fields["library"]) }}
      </div>
      <div class="col align-self-center" id="collection_wrapper">{{ macro.context_select("collection", context_fields["collection"]) }}</div>
      <div class="col align-self-center" id="record_type_wrapper">{{ macro.context_select("record_type", context_fields["record_type"]) }}</div>
      <div class="col-2 text-center">
        <div id="library-img"></div>
      </div>
      <div class="col-2 text-center align-self-center d-flex flex-column gap-2">
        <div class="row" id="collection-display"></div>
        <div class="row" id="record-type-display"></div>
      </div>
    </div>
  </div>
</div>
