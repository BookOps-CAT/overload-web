<div id="file-section" class="grid-container cols-3">
  <div class="card">
    <h5 class="card-title">Local Files</h5>
    <div class="form-group">
      <label for="local_files">Upload from your computer</label>
      <input id="local_files"
             hx-post="/files/upload"
             hx-trigger="change"
             hx-target="#selected-files"
             hx-swap="outerHTML"
             hx-include="#workflow_id"
             class="form-control"
             name="file"
             type="file"
             hx-encoding="multipart/form-data"
             multiple />
    </div>
  </div>
  <div class="card">
    <h5 class="card-title">FTP Files</h5>
    <p class="card-text">Browse vendor files</p>
    <div class="form-group">
      <label for="vendor">Vendors</label>
      <select id="vendor"
              class="form-control"
              name="vendor"
              form="pvf-form"
              hx-get="/files/remote/list"
              hx-target="#file_list"
              hx-trigger="change">
        <option value="" selected></option>
        {% for id, name in vendors.items() %}<option value="{{ id }}">{{ name }}</option>{% endfor %}
      </select>
    </div>
    <div id="file_list" class="overflow-auto mb-2 mt-1"></div>
  </div>
  <div class="card">
    <h5 class="card-title">Selected Files</h5>
    <div id="selected-files" hx-swap="outerHTML">{% include "pvf_partials/selected_files.html" %}</div>
  </div>
</div>
