{% extends 'base.html' %}
{% block page_title %}<h2>{{ page_title }}</h2>{% endblock %}
{% block content %}
  <div id="pvf-form"></div>
  <div id="get_workflow"
       hx-get="/pvf/workflow"
       hx-trigger="load"
       hx-swap="none"></div>
  <div id="context-section">{% include "pvf_partials/context_source.html" %}</div>
  <div id="file-section">{% include "pvf_partials/file_source.html" %}</div>
  <div id="template-section"></div>
  <div id="pvf_output">
    <button id="pvf-button" class="btn btn-nypl" form="pvf-form" type="submit">Process Vendor File</button>
  </div>
{% endblock %}
