{% extends 'base.html' %}
{% block page_title %}<h2>{{ page_title }}</h2>{% endblock %}
{% block content %}

  <div id="get_workflow"
       hx-get="/pvf/workflow"
       hx-trigger="load"
       hx-swap="none"></div>
  <div class="flex-col">
    {% include "pvf_partials/context_source.html" %}
    {% include "pvf_partials/file_source.html" %}

    <div id="pvf_output" class="flex-row">
      <button id="pvf-button" class="btn btn-nypl" form="pvf-form" type="submit">Process Vendor File</button>
    </div>
  </div>
{% endblock %}
