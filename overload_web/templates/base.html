<!DOCTYPE html>
<html lang="en">
  <head>
    {% block head %}
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <meta name="keywords" content="" />
      <meta name="description" content="BookOps cataloging toolkit" />
      <title>{{ application }}</title>
      <link rel="stylesheet" href="/static/css/bootstrap.min.css" />
      <link rel="stylesheet" href="/static/css/style.css" />
      <script src="https://unpkg.com/htmx.org@2.0.0"></script>
    {% endblock %}
  </head>
  <body>
    <header class="navbar shadow">
      <div class="container library-logo">
        {% block nav %}
          <a class="navbar-brand align-self-end" href='{{ url_for("root") }}'>{{ application }}</a>
          <div class="d-flex flex-row justify-content-end align-items-center">
            <div class="p-3">
              <div id="library-img"></div>
            </div>
            <div class="p-3 text-center">
              <div id="collection-display" class="mb-1"></div>
              <div id="record-type-display"></div>
            </div>
          </div>
        {% endblock %}
      </div>
    </header>
    <div class="container">
      <div class="page-title">
        {% block page_title %}{% endblock %}
      </div>
      <div class="content">
        {% block content %}{% endblock %}
      </div>
    </div>
    <script src="/static/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
