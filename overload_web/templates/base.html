<!DOCTYPE html>
<html lang="en">
  <head>
    {% block head %}
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <meta name="description" content="BookOps cataloging toolkit" />
      <title>{{ application }}</title>
      <link rel="stylesheet" href="/static/css/style.css" />
      <script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.1"
              integrity="sha384-Qp9rdC8H7EqOoX+nR0P3RPG2Noji+qdwJlGpfzwQJsfOpp3sGwIdSP9xO3+UlEhn"
              crossorigin="anonymous"></script>
    {% endblock %}
  </head>
  <body>
    <header>
      <div class="navbar">
        {% block nav %}
          <div class="nav-left">
            <h3><a href='{{ url_for("root") }}'>{{ application }}</a></h3>
          </div>
          <div class="nav-right" id="context-slot">
            <div id="library-img"></div>
            <div class="nav-text-stacked">
              <div id="collection-display"></div>
              <div id="record-type-display"></div>
            </div>
          </div>
        {% endblock %}
      </div>
    </header>
    <main>
      <div class="main-content">
        {% block page_title %}<h2 id="page-title">{{ page_title }}</h2>{% endblock %}
        {% block content %}{% endblock %}
      </div>
    </main>
  </body>
</html>
