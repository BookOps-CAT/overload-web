<!DOCTYPE html>
<html lang="en">
  <head>
    {% block head %}
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <meta name="keywords" content="" />
      <meta name="description" content="BookOps cataloging toolkit" />
      <title>{{ application }}</title>
      <link rel="stylesheet" href="/static/css/style.css" />
      <script src="https://unpkg.com/htmx.org@2.0.0"></script>
    {% endblock %}
  </head>
  <body>
    <header class="navbar">
      <div class="container navbar-container">
        {% block nav %}
          <div class="nav-left">
            <h3><a href='{{ url_for("root") }}'>{{ application }}</a></h3>
          </div>
          <div class="nav-right" id="context-slot">
            <div class="nav-logo" id="library-img"></div>
            <div class="nav-text-stacked"  id="context-text">
              <div id="collection-display"></div>
              <div id="record-type-display"></div>
            </div>
          </div>
        {% endblock %}
      </div>
    </header>
    <main class="main-content">
      <div class="container">
        <div class="page-title">
          {% block page_title %}{% endblock %}
        </div>
        <div class="content-body">
          {% block content %}{% endblock %}
        </div>
      </div>
    </main>
  </body>
</html>
