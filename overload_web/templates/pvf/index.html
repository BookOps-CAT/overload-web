{% extends "base.html" %}{% import "components/macros.html" as macro %}
{% block content %}
  <form id="pvf-form"
        class="flex-col gap-lg"
        hx-post="/pvf/process"
        hx-encoding="multipart/form-data"
        hx-target="#pvf-output"
        hx-sync="this:queue last"
        autocomplete="off">
    {% include "pvf/partials/sections/context.html" %}
    {% include "pvf/partials/sections/files.html" %}
    {% include "pvf/partials/sections/order_template.html" %}
    <div id="pvf-button" class="flex-row gap-lg">
      <button class="btn btn-nypl" form="pvf-form" type="submit">Process Vendor File</button>
    </div>
  </form>
  <div id="pvf-output" class="flex-col gap-lg"></div>
  <script>
  document.body.addEventListener("workflowCompleted", () => {
    ["files-section-details", "template-section-details"].forEach((id) => {
      document.getElementById(id)?.removeAttribute("open");
    });
  });
  </script>
{% endblock %}
