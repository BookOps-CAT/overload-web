{% if files %}
  <div class="checkbox-list">
    {% for file in files %}
      <label class="checkbox-item" for="{{ file }}">
        <input id="{{ file }}"
               type="checkbox"
               hx-post="/files/remote/select?vendor={{ vendor }}"
               hx-trigger="change[this.checked]"
               hx-vals='{{ {"remote_file": file} | tojson | forceescape }}'
               hx-include="#workflow_id"
               hx-params="remote_file,workflow_id"
               hx-swap="none" />
        <span>{{ file }}</span>
      </label>
    {% endfor %}
  </div>
{% else %}
  <p class="text-muted">No files available for this vendor.</p>
{% endif %}
