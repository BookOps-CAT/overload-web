<div class="checkbox-list">
  {% for file in files %}
    <label class="checkbox-item" for="{{ file }}">
      <input id="{{ file }}"
             hx-post="/files/remote/select?vendor={{ vendor }}"
             name="remote_file"
             hx-target="#selected-files"
             type="checkbox"
             hx-include="#vendor"
             form="pvf-form"
             value="{{ file }}" />
      <span>{{ file }}</span>
    </label>
  {% endfor %}
  <input name="vendor" type="hidden" value="{{ vendor }}" />
</div>
