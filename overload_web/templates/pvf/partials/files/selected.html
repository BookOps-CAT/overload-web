{% if files %}
  <div class="flex-col gap-lg">
    {% for f in files %}
      <div id="file-{{ f.id }}" class="selected-file-item">
        <div class="selected-file-info">
          <input type="hidden" name="file_id" value="{{ f.id }}">
          <strong class="truncate" title="{{ f.filename }}">{{ f.filename }}</strong>
          <span class="text-muted">{{ "Local file" if f.source == "local" else "FTP file" }}</span>
        </div>
        <button class="btn btn-nypl btn-sm"
                type="button"
                hx-post="/files/remove"
                hx-vals='{"file_id": "{{ f.id }}"}'
                hx-include="#workflow_id"
                hx-swap="none"
                hx-confirm="Are you sure?">Remove</button>
      </div>
    {% endfor %}
  </div>
{% endif %}
