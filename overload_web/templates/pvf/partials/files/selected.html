{% if files %}
  <div class="selected-file-list">
    {% for f in files %}
      <div id="file-{{ f.id }}" class="selected-file-item">
        <div class="selected-file-info">
          <input type="hidden" name="file_id" value="{{ f.id }}">
          <strong>{{ f.filename }}</strong>
          <small class="text-muted">
            {% if f.source == "local" %}
              Local file
            {% else %}
              FTP file
            {% endif %}
          </small>
        </div>
        <button class="btn btn-nypl btn-sm"
                type="button"
                hx-post="/files/remove"
                hx-vals='{"file_id": "{{ f.id }}"}'
                hx-include="#workflow_id"
                hx-swap="none">Remove</button>
      </div>
    {% endfor %}
  </div>
{% else %}
  <p class="text-muted">No files selected</p>
{% endif %}
