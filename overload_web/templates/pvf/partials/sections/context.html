{% import "components/macros.html" as macro %}
<div hidden
     id="get_workflow"
     hx-get="/pvf/workflow"
     hx-trigger="load"
     hx-target="this"></div>
<div class="flex-row"
     id="context-section"
     hx-get="/update-context?workflow=pvf"
     hx-trigger="change delay:200ms"
     hx-include="this"
     hx-swap="none">
  <div id="library-select"
       class="flex-1">{{ macro.context_select("library", context_fields.library, "pvf-form") }}</div>
  <div id="collection-select"
       class="flex-1">{{ macro.context_select("collection", context_fields.collection, "pvf-form") }}</div>
  <div id="record-type-select"
       class="flex-1">{{ macro.context_select("record_type", context_fields.record_type, "pvf-form") }}</div>
</div>
