{% import "components/macros.html" as macro %}
<div id="file-section"
     class="grid-container cols-2"
     hx-sync="#pvf-form:queue all">
  <div class="card">
    {% call macro.collapsible_section("Vendor Files", id="files-section-details") %}
      <div class="form-group">
        <span class="form-label">Upload local files</span>
        <label for="local_files"
               class="file-dropzone"
               ondragover="event.preventDefault();"
               ondrop="
                 event.preventDefault();
                 const input = document.getElementById('local_files');
                 input.files = event.dataTransfer.files;
                 input.dispatchEvent(new Event('change', { bubbles: true }));
               ">
          <div class="dropzone-text">
            <span class="dropzone-title">Browse</span>
            <span class="dropzone-subtitle">or drag & drop</span>
          </div>
          <input id="local_files"
                 hx-post="/files/upload"
                 hx-trigger="change"
                 hx-target="#selected-files"
                 hx-include="#workflow_id"
                 name="file"
                 type="file"
                 hx-encoding="multipart/form-data"
                 class="sr-only"
                 multiple />
        </label>
      </div>
      <div class="uppercase divider-or"><span>or</span></div>
      <div class="form-group">
        <label for="vendor">Select files from vendor FTP</label>
        <select id="vendor"
                class="form-control"
                name="vendor"
                hx-get="/files/remote/list"
                hx-target="#file-list"
                hx-trigger="change">
          <option value="" selected></option>
          {% for id, name in vendors.items() %}<option value="{{ id }}">{{ name }}</option>{% endfor %}
        </select>
      </div>
      <div id="file-list"></div>
    {% endcall %}
  </div>
  <div class="card">
    {% call macro.collapsible_section("Selected Files", id="selected-files-section-details") %}
      <div id="selected-files"
           hx-get="/files/list"
           hx-include="#workflow_id"
           hx-target="this"
           hx-trigger="workflowFilesChanged from:body"></div>
    {% endcall %}
  </div>
</div>
