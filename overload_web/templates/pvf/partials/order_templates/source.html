{% import "components/macros.html" as macro %}
{% call macro.collapsible_section("Select order template", id="template-section-details") %}
  <div id="template-list"
       hx-get="/ot/templates"
       hx-trigger="load, templatesChanged from:body"
       name="templates"
       hx-target="this"></div>
  <hr class="horizontal-rule" />
  <h5>Create/Update order template</h5>
  <div id="template-form" class="flex-col lg-flex-row gap-lg">
    {% include "pvf/partials/order_templates/form.html" %}
  </div>
{% endcall %}
