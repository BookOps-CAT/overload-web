<div id="report-section" class="grid-container">
  <div class="card">
    <details id="output-files-container" class="collapsible-section" open>
      <summary class="section-summary">
        <h5>Processed Files</h5>
        <svg class="collapse-chevron"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </summary>
      <div class="section-body">{% include "pvf/partials/files/processed.html" %}</div>
    </details>
    <hr class="horizontal-rule" />
    <div id="summary-report-container" class="flex-col">{% include "pvf/partials/reports/summary.html" %}</div>
    <div id="detailed-report-container" class="flex-col"></div>
  </div>
</div>
<div class="grid-container" id="output-buttons">
  <div class="flex-row" id="report-buttons">
    <button id="detailed-report-button"
            type="button"
            hx-get="/reports/detailed?workflow_id={{ workflow_id }}"
            hx-target="#detailed-report-container"
            class="btn-nypl">View detailed report</button>
    <button id="save-report-button"
            type="button"
            hx-post="/reports/write?workflow_id={{ workflow_id }}"
            hx-target="#detailed-report-container"
            hx-swap="beforeend"
            class="btn-nypl">Save Processing Statistics</button>
  </div>
  <div class="flex-row">
    <button type="button"
            class="btn-nypl"
            hx-get='{{ url_for("vendor_file_page") }}'
            hx-target="body"
            hx-push-url="true">Reset form</button>
  </div>
</div>
<div hx-post="/files/cleanup"
     hx-trigger="workflowCompleted from:body"
     hx-include="#workflow_id"
     hx-swap="none"></div>
