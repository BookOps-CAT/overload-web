{% import "components/macros.html" as macro %}
<div id="report-section" class="grid-container">
  <div class="card flex-col gap-md">
    {% call macro.collapsible_section("Processed Files", id="output-files-container") %}
      {% include "pvf/partials/files/processed.html" %}
    {% endcall %}
    <hr class="horizontal-rule" />
    <div id="summary-report-container" class="flex-col gap-lg">{% include "pvf/partials/reports/summary.html" %}</div>
    <div id="detailed-report-container" class="flex-col gap-lg"></div>
  </div>
</div>
<div class="flex-row gap-lg"  id="output-buttons">
  <button id="detailed-report-button"
          type="button"
          hx-get="/reports/detailed?workflow_id={{ workflow_id }}"
          hx-target="#detailed-report-container"
          class="btn btn-nypl">View detailed report</button>
  <button id="save-report-button"
          type="button"
          hx-post="/reports/write?workflow_id={{ workflow_id }}"
          hx-target="#detailed-report-container"
          hx-swap="beforeend"
          class="btn btn-nypl">Save Processing Statistics</button>
  <button type="button"
          class="btn btn-nypl"
          hx-get='{{ url_for("vendor_file_page") }}'
          hx-target="body"
          hx-push-url="true">Reset form</button>
</div>
<div hx-post="/files/cleanup"
     hx-trigger="workflowCompleted from:body"
     hx-include="#workflow_id"
     hx-swap="none"></div>
