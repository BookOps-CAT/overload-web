<div id="report-section" class="grid-container">
  <div class="card">
    <div id="summary-report-container"
         hx-get="/reports/summary?batch_id={{ batch_id }}"
         hx-trigger="load"
         name="vendor_report"></div>
    <div id="output-files-container"
         hx-get="/files/list/processed-files?batch_id={{ batch_id }}"
         hx-trigger="load"
         name="processed_file"></div>
  </div>
</div>
<div class="grid-container" id="output-buttons">
  <div class="flex-row" id="report-buttons">
    <button id="detailed-report-button"
            type="submit"
            hx-get="/reports/detailed?batch_id={{ batch_id }}"
            hx-target="#summary-report-container"
            hx-swap="afterend"
            class="btn btn-nypl">View detailed report</button>
    <button id="save-report-button"
            type="submit"
            hx-post="/reports/write?batch_id={{ batch_id }}"
            class="btn btn-nypl">Save Processing Statistics</button>
  </div>
  <div class="flex-row">
    <button type="button"
            class="btn btn-nypl"
            hx-get='{{ url_for("vendor_file_page") }}'
            hx-target="body"
            hx-push-url="true">Reset form</button>
  </div>
</div>
